<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>BeautyPass · Beheer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#faf9f6;font-family:"Manrope",system-ui,sans-serif;color:#1d1a17;-webkit-font-smoothing:antialiased}
a{color:#4b2e22}a:hover{color:#1d1a17}
code{font-family:ui-monospace,monospace;font-size:.92em;background:#f3efe8;padding:1px 5px;border-radius:5px}
@keyframes bpFade{from{opacity:0}to{opacity:1}}
@keyframes aSlide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes aIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes bpToast{0%{transform:translate(-50%,20px);opacity:0}10%,88%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,10px);opacity:0}}
.a-row{transition:background .12s}.a-row:hover{background:#f6f2ec}
.a-slot:hover{background:#f6f2ec;cursor:pointer}
.a-btn:hover:not(:disabled){filter:brightness(.94)}
.a-nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;color:#5f5850;cursor:pointer;transition:background .12s}
.a-nav:hover{background:#efe9e0}.a-nav.on{background:#1d1a17;color:#fff}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid #e6e0d6;padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;box-sizing:border-box;background:#f6f3ee}
.main{padding:32px clamp(16px,4vw,48px) 60px;max-width:1280px;width:100%;box-sizing:border-box}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid #e6e0d6}.side .brand,.side .foot{display:none}.a-nav span{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/beheer/main.jsx"></script>

</body>
</html>
