<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Your beauty, brought together. In one membership. Join BeautyPass First access. Amsterdam — opening soon.">
  <meta name="theme-color" content="#ffffff">
  <title>BeautyPass — First access</title>
  <link rel="preload" href="assets/fonts/font-01.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/font-02.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="muse-hero-split-v4.css">
  <script src="first-access-screen.js?v=1" defer></script>
</head>
<body>
  <main class="hero" aria-label="BeautyPass First access">
    <header class="brand">
      <img class="wordmark" src="assets/beautypass-wordmark-v6-small-ink.svg" width="8349" height="1130" alt="BeautyPass">
    </header>
    <div class="visual" aria-hidden="true">
      <img src="assets/muse-hero-desktop-pearl-v3.jpg" width="1672" height="941" alt="" fetchpriority="high">
    </div>
    <section class="panel" aria-labelledby="hero-title">
      <div class="panel-content">
        <div class="promise">
          <h1 id="hero-title"><span>YOUR BEAUTY</span><em>Brought together</em></h1>
          <p class="membership">In one membership</p>
        </div>
        <div class="signup">
          <p id="access-intro">Be first to discover our memberships.</p>
          <form id="access-form" aria-label="First access" aria-describedby="access-intro" novalidate>
            <div class="access-fields">
              <label class="email-field">
                <span class="sr-only">Email address</span>
                <input type="email" name="email" placeholder="Email address" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required maxlength="254" aria-describedby="access-status">
              </label>
              <button type="submit"><span>Join the list</span><svg width="24" height="18" viewBox="0 0 24 18" fill="none" aria-hidden="true"><path d="M2 9h19M14 2l7 7-7 7" stroke="currentColor" stroke-width="1.2"/></svg></button>
            </div>
            <p id="access-status" role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </div>
      <footer><p>Amsterdam <span>·</span> Opening soon</p><a href="mailto:hallo@beautypass.nl">Contact</a></footer>
    </section>
  </main>
</body>
</html>
